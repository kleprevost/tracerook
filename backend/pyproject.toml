[project]
name = "tracerook-backend"
version = "0.1.0"
description = "TraceRook Cloud: hosted analysis, accounts and usage metering for the TraceRook macOS client"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "anthropic>=1.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx2"]

[project.scripts]
tracerook-admin = "tracerook_backend.admin:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tracerook_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
