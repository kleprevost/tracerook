<main id="main" class="auth wrap">
  <div class="auth-layout">
    <div class="auth-copy"><div class="eyebrow">Welcome back</div><h1>Log in to<br>TraceRook.</h1><p class="intro">Manage your beta subscription, access code and enrolled Macs.</p><a class="text-link" href="/docs/beta/">Installation guide</a></div>
    <section class="auth-card" aria-labelledby="login-title">
      <h2 id="login-title">Log in</h2>
      <form class="auth-form" data-auth-form="login" action="/api/auth/login" method="post" novalidate>
        <label for="login-email">Email</label>
        <input id="login-email" name="email" type="email" autocomplete="username" inputmode="email" required maxlength="254">
        <label for="login-password">Password</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required maxlength="256">
        <button class="button primary" type="submit">Log in</button>
        <p class="form-status" role="status" aria-live="polite"></p>
      </form>
      <p class="auth-switch">New to TraceRook? <a href="/register/">Join the beta</a></p>
    </section>
  </div>
</main>
